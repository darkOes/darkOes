<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="1" stop-color="#0a1016"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b10" stop-opacity="0"/>
      <stop offset="1" stop-color="#070b10" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="scanBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="0.6" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FCEE0A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FCEE0A" stop-opacity="0"/>
    </radialGradient>
    <mask id="cityMask">
      <rect x="540" y="45" width="450" height="330" fill="url(#fadeLeft)"/>
    </mask>
    <pattern id="winY" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="4" height="6" fill="#FCEE0A" opacity="0.45"/>
    </pattern>
    <pattern id="winC" width="10" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="3" height="5" fill="#00F0FF" opacity="0.35"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inner"><rect x="12" y="12" width="976" height="496" rx="5"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .script{font-family:'Segoe Script','Brush Script MT','Comic Sans MS',cursive;font-style:italic}
      .line{opacity:0;animation:show .25s ease-out forwards}
      .l1{animation-delay:.5s}.l2{animation-delay:1.1s}.l3{animation-delay:1.7s}
      .l4{animation-delay:2.3s}.l5{animation-delay:2.9s}.l6{animation-delay:3.6s}
      .cursor{animation:blink 1s steps(1) infinite}
      .flick{animation:flicker 5s infinite}
      .flick2{animation:flicker 7s 1.3s infinite}
      .win{animation:win 4s ease-in-out infinite}
      .win2{animation:win 6s 2s ease-in-out infinite}
      .gR{animation:glitchR 4s infinite}
      .gC{animation:glitchC 4s infinite}
      .scanbar{animation:scan 6s linear infinite}
      .frame{animation:pulse 3s ease-in-out infinite}
      .box{stroke:#26323d;animation:hl 6s infinite}
      .b1{animation-delay:0s}.b2{animation-delay:1s}.b3{animation-delay:2s}
      .b4{animation-delay:3s}.b5{animation-delay:4s}.b6{animation-delay:5s}
      @keyframes show{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes flicker{0%,89%,100%{opacity:1}90%{opacity:.25}91%{opacity:1}93%{opacity:.5}94%{opacity:1}}
      @keyframes win{0%,100%{opacity:.9}50%{opacity:.35}}
      @keyframes glitchR{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.8;transform:translate(-4px,1px)}89%{opacity:.8;transform:translate(3px,-1px)}90%{opacity:0}}
      @keyframes glitchC{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.8;transform:translate(4px,-1px)}89%{opacity:.8;transform:translate(-3px,1px)}90%{opacity:0}}
      @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(560px)}}
      @keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.55}}
      @keyframes hl{0%,14%{stroke:#FCEE0A}18%,100%{stroke:#26323d}}
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="520" rx="8" fill="url(#bg)"/>

  <g clip-path="url(#inner)">
    <!-- city -->
    <rect x="540" y="45" width="450" height="330" fill="url(#cityGlow)"/>
    <g mask="url(#cityMask)">
      <circle cx="625" cy="85" r="15" fill="#fff6c2" opacity="0.85" filter="url(#glowSoft)"/>
      <g fill="#0b131d" stroke="#16222e">
        <rect x="560" y="150" width="50" height="230"/>
        <rect x="615" y="95" width="60" height="285"/>
        <rect x="680" y="200" width="40" height="180"/>
        <rect x="725" y="125" width="70" height="255"/>
        <rect x="800" y="62" width="55" height="318"/>
        <rect x="860" y="170" width="45" height="210"/>
        <rect x="910" y="105" width="80" height="275"/>
      </g>
      <g class="win">
        <rect x="560" y="150" width="50" height="230" fill="url(#winY)"/>
        <rect x="725" y="125" width="70" height="255" fill="url(#winY)"/>
        <rect x="910" y="105" width="80" height="275" fill="url(#winY)"/>
      </g>
      <g class="win2">
        <rect x="615" y="95" width="60" height="285" fill="url(#winC)"/>
        <rect x="800" y="62" width="55" height="318" fill="url(#winC)"/>
        <rect x="860" y="170" width="45" height="210" fill="url(#winY)"/>
      </g>
      <line x1="827" y1="62" x2="827" y2="40" stroke="#16222e" stroke-width="2"/>
      <circle cx="827" cy="44" r="2.5" fill="#FF2A6D" class="flick"/>
      <rect x="862" y="185" width="6" height="70" fill="#FF2A6D" class="flick2" filter="url(#glow)"/>
      <rect x="617" y="110" width="5" height="55" fill="#00F0FF" class="flick" filter="url(#glow)"/>
    </g>
    <rect x="540" y="300" width="450" height="80" fill="url(#fadeBottom)"/>

    <!-- netrunner -->
    <path d="M 650 365 C 650 300 668 268 693 258 C 683 243 681 218 693 203 C 705 188 731 188 743 203 C 755 218 753 243 743 258 C 768 268 786 300 786 365 Z"
          fill="#04070a" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="718" y="318" font-size="34" fill="#18232f" text-anchor="middle" font-family="'Yu Gothic','Noto Sans CJK JP','MS Gothic',sans-serif">暗</text>

    <!-- right list -->
    <g class="mono" font-size="12" fill="#e6edf3" text-anchor="end" letter-spacing="2">
      <text x="970" y="74">IDEAS</text>
      <text x="970" y="92">MODELS</text>
      <text x="970" y="110">AGENTS</text>
      <text x="970" y="128">REALITY</text>
      <text x="970" y="146" fill="#FCEE0A">—</text>
    </g>

    <!-- tagline -->
    <g transform="rotate(-9 860 300)" fill="#FCEE0A" filter="url(#glow)" class="script">
      <text x="975" y="292" font-size="24" text-anchor="end">Never fade away</text>
      <text x="985" y="324" font-size="20" text-anchor="end">from the source code.</text>
    </g>

    <!-- title -->
    <rect x="66" y="62" width="3" height="120" fill="#FCEE0A"/>
    <polyline points="82,70 104,92 82,114" fill="none" stroke="#FCEE0A" stroke-width="5" filter="url(#glow)"/>
    <g class="mono" font-size="52" font-weight="700">
      <text x="122" y="111" fill="#FF2A6D" class="gR">darkOes.exe</text>
      <text x="122" y="111" fill="#00F0FF" class="gC">darkOes.exe</text>
      <text x="122" y="111" fill="#FCEE0A" filter="url(#glow)" class="flick">darkOes.exe</text>
    </g>
    <text x="84" y="150" class="mono" font-size="23" fill="#00F0FF" letter-spacing="2" filter="url(#glow)">AI ENGINEERING // NETRUNNER</text>
    <text x="86" y="176" class="mono" font-size="11" fill="#6b7a86" letter-spacing="2.5">BUILDING INTELLIGENCE FOR A MORE OPEN TOMORROW.</text>

    <!-- terminal -->
    <rect x="40" y="196" width="380" height="166" fill="#05090d" fill-opacity="0.85" stroke="#FCEE0A" stroke-opacity="0.45"/>
    <rect x="40" y="196" width="3" height="166" fill="#FCEE0A"/>
    <g class="mono" font-size="13.5">
      <text x="58" y="221" fill="#FCEE0A" class="line l1">$ initialize neural_link</text>
      <text x="58" y="243" fill="#c9d1d9" class="line l2"><tspan fill="#00F0FF">→</tspan> loading python modules...</text>
      <text x="58" y="265" fill="#c9d1d9" class="line l3"><tspan fill="#00F0FF">→</tspan> loading llm stack...</text>
      <text x="58" y="287" fill="#c9d1d9" class="line l4"><tspan fill="#00F0FF">→</tspan> loading vector databases...</text>
      <text x="58" y="309" fill="#c9d1d9" class="line l5"><tspan fill="#00F0FF">→</tspan> connecting to agents...</text>
      <text x="58" y="331" fill="#39FF14" class="line l6" filter="url(#glow)"><tspan fill="#00F0FF">→</tspan> access granted.</text>
      <text x="58" y="352" fill="#FCEE0A" class="line l6">$ <tspan class="cursor">█</tspan></text>
    </g>

    <!-- technologies -->
    <text x="40" y="390" class="mono" font-size="13" fill="#00F0FF" letter-spacing="2">// TECHNOLOGIES</text>
    <line x1="182" y1="386" x2="660" y2="386" stroke="#00F0FF" stroke-opacity="0.3"/>

    <g class="mono" font-size="12" fill="#e6edf3" text-anchor="middle">
      <!-- Python -->
      <rect x="40" y="400" width="95" height="88" rx="3" fill="#0b1118" class="box b1"/>
      <rect x="76" y="414" width="18" height="18" rx="5" fill="#3776AB"/>
      <rect x="84" y="424" width="18" height="18" rx="5" fill="#FFD43B"/>
      <circle cx="81" cy="419" r="1.8" fill="#fff"/><circle cx="97" cy="437" r="1.8" fill="#333"/>
      <text x="87.5" y="472">Python</text>

      <!-- PyTorch -->
      <rect x="145" y="400" width="95" height="88" rx="3" fill="#0b1118" class="box b2"/>
      <path d="M 186 421 A 12 12 0 1 0 200 421" fill="none" stroke="#EE4C2C" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="193" y1="410" x2="186" y2="421" stroke="#EE4C2C" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="200" cy="415" r="2.2" fill="#EE4C2C"/>
      <text x="192.5" y="472">PyTorch</text>

      <!-- TensorFlow -->
      <rect x="250" y="400" width="95" height="88" rx="3" fill="#0b1118" class="box b3"/>
      <path d="M 284 414 L 298 406 L 298 446 L 291 450 L 291 422 L 284 426 Z" fill="#FF8F00"/>
      <path d="M 300 406 L 314 414 L 314 422 L 300 414 Z" fill="#FFA000"/>
      <path d="M 300 422 L 308 426 L 308 432 L 300 428 Z" fill="#FFA000"/>
      <text x="297.5" y="472">TensorFlow</text>

      <!-- LLMs -->
      <rect x="355" y="400" width="95" height="88" rx="3" fill="#0b1118" class="box b4"/>
      <rect x="391" y="416" width="23" height="23" rx="3" fill="none" stroke="#00F0FF" stroke-width="2"/>
      <rect x="397" y="422" width="11" height="11" fill="#00F0FF" opacity="0.6"/>
      <g stroke="#00F0FF" stroke-width="2">
        <line x1="396" y1="410" x2="396" y2="416"/><line x1="402.5" y1="410" x2="402.5" y2="416"/><line x1="409" y1="410" x2="409" y2="416"/>
        <line x1="396" y1="439" x2="396" y2="445"/><line x1="402.5" y1="439" x2="402.5" y2="445"/><line x1="409" y1="439" x2="409" y2="445"/>
        <line x1="385" y1="421" x2="391" y2="421"/><line x1="385" y1="434" x2="391" y2="434"/>
        <line x1="414" y1="421" x2="420" y2="421"/><line x1="414" y1="434" x2="420" y2="434"/>
      </g>
      <text x="402.5" y="472">LLMs</text>

      <!-- RAG -->
      <rect x="460" y="400" width="95" height="88" rx="3" fill="#0b1118" class="box b5"/>
      <path d="M 494 414 L 494 440 A 13.5 5 0 0 0 521 440 L 521 414" fill="#1f6feb"/>
      <ellipse cx="507.5" cy="414" rx="13.5" ry="5" fill="#58a6ff"/>
      <path d="M 494 423 A 13.5 5 0 0 0 521 423 M 494 432 A 13.5 5 0 0 0 521 432" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="507.5" y="472">RAG</text>

      <!-- Agents -->
      <rect x="565" y="400" width="95" height="88" rx="3" fill="#0b1118" class="box b6"/>
      <g stroke="#58a6ff" stroke-width="2" fill="none">
        <line x1="612.5" y1="413" x2="599" y2="440"/><line x1="612.5" y1="413" x2="626" y2="440"/><line x1="599" y1="440" x2="626" y2="440"/>
      </g>
      <g fill="#0b1118" stroke="#58a6ff" stroke-width="2.5">
        <circle cx="612.5" cy="413" r="5"/><circle cx="599" cy="440" r="5"/><circle cx="626" cy="440" r="5"/>
      </g>
      <text x="612.5" y="472">Agents</text>
    </g>

    <g class="mono" font-size="11" fill="#6b7a86" letter-spacing="2">
      <text x="678" y="425">// TURNING</text>
      <text x="692" y="443">DATA INTO</text>
      <text x="692" y="461">POSSIBILITIES</text>
    </g>

    <!-- 0+2=1 shard -->
    <g>
      <path d="M 820 400 L 975 400 L 975 478 L 965 488 L 820 488 Z" fill="#0b1118" stroke="#FCEE0A" stroke-opacity="0.8"/>
      <path d="M 820 412 L 820 400 L 832 400" fill="none" stroke="#FCEE0A" stroke-width="3"/>
      <text x="838" y="432" class="mono flick2" font-size="20" font-weight="700" fill="#FCEE0A" filter="url(#glow)">"0+2=1"</text>
      <text x="838" y="456" class="mono" font-size="10" fill="#8b98a5" letter-spacing="2">DIFFERENT INPUTS.</text>
      <text x="838" y="472" class="mono" font-size="10" fill="#8b98a5" letter-spacing="2">SAME INTELLIGENCE.</text>
    </g>

    <!-- scanlines -->
    <rect width="1000" height="520" fill="url(#scan)" opacity="0.5"/>
    <rect class="scanbar" x="0" y="0" width="1000" height="120" fill="url(#scanBar)"/>
  </g>

  <!-- top bar -->
  <line x1="12" y1="44" x2="988" y2="44" stroke="#00F0FF" stroke-opacity="0.35"/>
  <circle cx="36" cy="28" r="7" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="52" y="32" class="mono" font-size="12" fill="#c9d1d9">darkOes / <tspan font-weight="700" fill="#e6edf3">README.md</tspan></text>
  <text x="900" y="32" class="mono" font-size="12" fill="#c9d1d9" text-anchor="end" letter-spacing="1">SYS v1.0.0</text>
  <text x="922" y="32" class="mono" font-size="14" fill="#FCEE0A" text-anchor="middle">✓</text>
  <text x="950" y="32" class="mono" font-size="14" fill="#FCEE0A" text-anchor="middle">✕</text>

  <!-- frame -->
  <rect x="10" y="10" width="980" height="500" rx="6" fill="none" stroke="#00F0FF" stroke-width="2" class="frame" filter="url(#glow)"/>
  <g stroke="#FCEE0A" stroke-width="4" fill="none">
    <path d="M 10 40 L 10 10 L 40 10"/>
    <path d="M 960 510 L 990 510 L 990 480"/>
  </g>
</svg>
